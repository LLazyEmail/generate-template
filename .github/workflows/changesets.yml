name: Version packages

on:
  push:
    branches: [main]

concurrency:
  group: changesets
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  version:
    name: Open version PR or tag a release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: '@llazyemail'

      - run: npm ci --no-audit --no-fund

      - name: Create version PR, or a GitHub Release after it merges
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npm run version-packages
          publish-script: npx changeset publish
          pr-title: Version packages
          commit-message: Version packages
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
