name: Sandbox HTML

on:
  pull_request:
    branches: [main]

concurrency:
  group: sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  generate:
    name: Generate sandbox HTML
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Render sandbox through the shared action
        uses: LLazyEmail/email-template-workflows@v1
        with:
          working-directory: .
          command: npm run sandbox
          artifact-directory: sandbox/generated
          upload-artifact: true
          artifact-name: sandbox-html-pr-${{ github.event.pull_request.number }}

      - name: Require generated HTML
        run: |
          set -euo pipefail
          test -s sandbox/generated/index.html
          test -s sandbox/generated/rendered.txt
          count=$(grep -c '<li>' sandbox/generated/index.html)
          echo "indexed $count html files"
          test "$count" -ge 1
