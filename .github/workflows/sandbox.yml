name: Sandbox HTML

on:
  pull_request:
    branches: [main]

concurrency:
  group: sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  generate:
    name: Generate sandbox HTML
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Render sandbox through the shared action
        uses: LLazyEmail/email-template-workflows@v1
        with:
          working-directory: .
          command: npm run sandbox
          artifact-directory: sandbox/generated
          upload-artifact: true
          artifact-name: sandbox-html-pr-${{ github.event.pull_request.number }}

      - name: Require generated HTML
        run: |
          set -euo pipefail
          test -s sandbox/generated/index.html
          test -s sandbox/generated/rendered.txt
          count=$(grep -c '<li>' sandbox/generated/index.html)
          echo "indexed $count html files"
          test "$count" -ge 1

      - name: Comment on the pull request
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const list = fs.readFileSync('sandbox/generated/rendered.txt', 'utf8')
              .split('\n')
              .map((line) => line.trim())
              .filter(Boolean)
              .map((line) => `- \`${line}\``)
              .join('\n');
            const body = [
              '### Sandbox HTML',
              '',
              'This PR rendered the sandbox templates via `email-template-workflows`.',
              '',
              list,
              '',
              `- Run: ${runUrl}`,
              `- Artifact: \`sandbox-html-pr-${context.payload.pull_request.number}\``,
              '',
              'Open the run → **Artifacts** → download → open `index.html`.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes('### Sandbox HTML'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
