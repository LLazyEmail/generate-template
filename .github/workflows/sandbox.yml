name: Sandbox HTML

on:
  pull_request:
    branches: [main]

concurrency:
  group: sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  generate:
    name: Generate sandbox HTML
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Render sandbox through the shared action
        uses: LLazyEmail/email-template-workflows@d033cc177f9fff39fd4baa74df0d2ea07e6a42cb # v2.5.0
        with:
          working-directory: .
          package-manager: npm
          command: npm run sandbox
          install-command: npm ci --no-audit --no-fund
          node-version: 24
          artifact-directory: sandbox/generated
          upload-artifact: true
          artifact-name: sandbox-html-pr-${{ github.event.pull_request.number }}
          job-summary: true

      - name: Require generated HTML
        run: |
          set -euo pipefail
          test -s sandbox/generated/index.html
          test -s sandbox/generated/rendered.txt
          count=$(grep -c '<li>' sandbox/generated/index.html)
          echo "indexed $count html files"
          test "$count" -ge 1
