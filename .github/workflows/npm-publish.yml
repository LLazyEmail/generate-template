# Publish @llazyemail/generate-template to npmjs.org when a Release is published.
#
# Required repo secret: NPM_TOKEN — an npm automation/granular token with
# publish rights to the @llazyemail scope on https://www.npmjs.com/

name: Publish to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only (do not publish)'
        required: false
        type: boolean
        default: false

concurrency:
  group: npmjs-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@llazyemail'

      - run: npm install --no-audit --no-fund

      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

      - name: Publish to npmjs.org
        if: ${{ github.event_name == 'release' || inputs.dry_run != true }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
