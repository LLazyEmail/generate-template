# Publish @llazyemail/generate-template to npmjs.org when a Release is published.
#
# Required repo secret: NPM_TOKEN
#   Settings → Secrets and variables → Actions → New repository secret
#   Create an npm Automation token (or granular token with Read/write on
#   @llazyemail/generate-template) at https://www.npmjs.com/settings/~/tokens

name: Publish to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only (do not publish)'
        required: false
        type: boolean
        default: false

concurrency:
  group: npmjs-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@llazyemail'
          always-auth: true

      - run: npm install --no-audit --no-fund

      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

      - name: Check NPM_TOKEN
        if: ${{ github.event_name == 'release' || inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty. Add an npm automation token at Settings → Secrets → Actions as NPM_TOKEN."
            exit 1
          fi

      - name: Publish to npmjs.org
        if: ${{ github.event_name == 'release' || inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cat > "$HOME/.npmrc" <<'EOF'
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          @llazyemail:registry=https://registry.npmjs.org/
          always-auth=true
          EOF
          npm publish --access public --provenance
