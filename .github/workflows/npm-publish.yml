# Publish @llazyemail/generate-template to GitHub Packages when a Release is published.
#
# Auth is the workflow GITHUB_TOKEN. The package scope must match the owner
# (LLazyEmail -> @llazyemail). Repo visibility controls package visibility.
# No NPM_TOKEN secret is required.

name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only (do not publish)'
        required: false
        type: boolean
        default: false

concurrency:
  group: github-packages-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: '@llazyemail'

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - run: npm pack --dry-run

      - name: Keep the CLI bins executable
        run: chmod +x dist/cli.js dist/assert-cli.js

      - name: Publish to GitHub Packages
        if: ${{ github.event_name == 'release' || inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
